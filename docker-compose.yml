# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json
services:
  postgres:
    # pg16-compatible image with the pgvector extension preinstalled.
    # Keeps PostgreSQL 16 so the existing named volume remains compatible.
    image: pgvector/pgvector:pg16
    container_name: ai-playground-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-playground}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_locally}
      POSTGRES_DB: ${POSTGRES_DB:-ai_playground}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ai-playground-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-playground-migrate
    restart: "no"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: "postgresql://${POSTGRES_USER:-playground}:${POSTGRES_PASSWORD:-change_me_locally}@postgres:5432/${POSTGRES_DB:-ai_playground}"
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost:5173}"
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_EMBEDDING_DIMENSIONS: ${OPENAI_EMBEDDING_DIMENSIONS:-1536}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-5}
      TASK_DELETE_SECRET: ${TASK_DELETE_SECRET:-local-dev-task-delete-secret}
      SEMANTIC_SEARCH_MAX_FILE_SIZE_MB: ${SEMANTIC_SEARCH_MAX_FILE_SIZE_MB:-10}
      SEMANTIC_SEARCH_CHUNK_SIZE: ${SEMANTIC_SEARCH_CHUNK_SIZE:-800}
      SEMANTIC_SEARCH_CHUNK_OVERLAP: ${SEMANTIC_SEARCH_CHUNK_OVERLAP:-120}
      RAG_MODEL: ${RAG_MODEL:-}
      RAG_DEFAULT_TOP_K: ${RAG_DEFAULT_TOP_K:-5}
      RAG_SIMILARITY_THRESHOLD: ${RAG_SIMILARITY_THRESHOLD:-0.22}
      RAG_MAX_CONTEXT_CHARS: ${RAG_MAX_CONTEXT_CHARS:-12000}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      RESEARCH_MAX_RESULTS: ${RESEARCH_MAX_RESULTS:-6}
      RESEARCH_MAX_FOLLOWUP_QUERIES: ${RESEARCH_MAX_FOLLOWUP_QUERIES:-2}
      RESEARCH_FETCH_TIMEOUT_MS: ${RESEARCH_FETCH_TIMEOUT_MS:-8000}
      RESEARCH_MAX_PAGE_BYTES: ${RESEARCH_MAX_PAGE_BYTES:-500000}
      RESEARCH_MODEL: ${RESEARCH_MODEL:-}
      SUMMARIZER_MODEL: ${SUMMARIZER_MODEL:-}
      SUMMARIZER_MAX_FILE_SIZE_MB: ${SUMMARIZER_MAX_FILE_SIZE_MB:-10}
      SUMMARIZER_CHUNK_SIZE: ${SUMMARIZER_CHUNK_SIZE:-3000}
      SUMMARIZER_CHUNK_OVERLAP: ${SUMMARIZER_CHUNK_OVERLAP:-300}
      SUMMARIZER_MAX_CHUNKS: ${SUMMARIZER_MAX_CHUNKS:-24}
      SUMMARIZER_DIRECT_MAX_CHARS: ${SUMMARIZER_DIRECT_MAX_CHARS:-12000}
      SUMMARIZER_MAP_CONCURRENCY: ${SUMMARIZER_MAP_CONCURRENCY:-3}
      SUMMARIZER_TIMEOUT_MS: ${SUMMARIZER_TIMEOUT_MS:-60000}
      PORT: "3000"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-local-dev-jwt-access-secret-please-change-in-production-min32chars}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-14}
      REFRESH_COOKIE_NAME: ${REFRESH_COOKIE_NAME:-playground_refresh}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-none}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-AI Playground}
      MAIL_FROM_EMAIL: ${MAIL_FROM_EMAIL:-noreply@ai-playground.local}
      OTP_TTL_SECONDS: ${OTP_TTL_SECONDS:-600}
      OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-5}
      OTP_RESEND_COOLDOWN_SECONDS: ${OTP_RESEND_COOLDOWN_SECONDS:-60}
      AUTH_RATE_LIMIT_WINDOW_MS: ${AUTH_RATE_LIMIT_WINDOW_MS:-900000}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-20}
    volumes:
      - .:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ai-playground-network
    command: ["npm", "run", "db:migrate"]

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-playground-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    environment:
      PORT: "3000"
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: "postgresql://${POSTGRES_USER:-playground}:${POSTGRES_PASSWORD:-change_me_locally}@postgres:5432/${POSTGRES_DB:-ai_playground}"
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost:5173}"
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_EMBEDDING_DIMENSIONS: ${OPENAI_EMBEDDING_DIMENSIONS:-1536}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-5}
      TASK_DELETE_SECRET: ${TASK_DELETE_SECRET:-local-dev-task-delete-secret}
      SEMANTIC_SEARCH_MAX_FILE_SIZE_MB: ${SEMANTIC_SEARCH_MAX_FILE_SIZE_MB:-10}
      SEMANTIC_SEARCH_CHUNK_SIZE: ${SEMANTIC_SEARCH_CHUNK_SIZE:-800}
      SEMANTIC_SEARCH_CHUNK_OVERLAP: ${SEMANTIC_SEARCH_CHUNK_OVERLAP:-120}
      RAG_MODEL: ${RAG_MODEL:-}
      RAG_DEFAULT_TOP_K: ${RAG_DEFAULT_TOP_K:-5}
      RAG_SIMILARITY_THRESHOLD: ${RAG_SIMILARITY_THRESHOLD:-0.22}
      RAG_MAX_CONTEXT_CHARS: ${RAG_MAX_CONTEXT_CHARS:-12000}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      RESEARCH_MAX_RESULTS: ${RESEARCH_MAX_RESULTS:-6}
      RESEARCH_MAX_FOLLOWUP_QUERIES: ${RESEARCH_MAX_FOLLOWUP_QUERIES:-2}
      RESEARCH_FETCH_TIMEOUT_MS: ${RESEARCH_FETCH_TIMEOUT_MS:-8000}
      RESEARCH_MAX_PAGE_BYTES: ${RESEARCH_MAX_PAGE_BYTES:-500000}
      RESEARCH_MODEL: ${RESEARCH_MODEL:-}
      SUMMARIZER_MODEL: ${SUMMARIZER_MODEL:-}
      SUMMARIZER_MAX_FILE_SIZE_MB: ${SUMMARIZER_MAX_FILE_SIZE_MB:-10}
      SUMMARIZER_CHUNK_SIZE: ${SUMMARIZER_CHUNK_SIZE:-3000}
      SUMMARIZER_CHUNK_OVERLAP: ${SUMMARIZER_CHUNK_OVERLAP:-300}
      SUMMARIZER_MAX_CHUNKS: ${SUMMARIZER_MAX_CHUNKS:-24}
      SUMMARIZER_DIRECT_MAX_CHARS: ${SUMMARIZER_DIRECT_MAX_CHARS:-12000}
      SUMMARIZER_MAP_CONCURRENCY: ${SUMMARIZER_MAP_CONCURRENCY:-3}
      SUMMARIZER_TIMEOUT_MS: ${SUMMARIZER_TIMEOUT_MS:-60000}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-local-dev-jwt-access-secret-please-change-in-production-min32chars}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-14}
      REFRESH_COOKIE_NAME: ${REFRESH_COOKIE_NAME:-playground_refresh}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-none}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-AI Playground}
      MAIL_FROM_EMAIL: ${MAIL_FROM_EMAIL:-noreply@ai-playground.local}
      OTP_TTL_SECONDS: ${OTP_TTL_SECONDS:-600}
      OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-5}
      OTP_RESEND_COOLDOWN_SECONDS: ${OTP_RESEND_COOLDOWN_SECONDS:-60}
      AUTH_RATE_LIMIT_WINDOW_MS: ${AUTH_RATE_LIMIT_WINDOW_MS:-900000}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-20}
    volumes:
      - .:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - ai-playground-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ../ai-playground-frontend
      dockerfile: Dockerfile
    container_name: ai-playground-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      VITE_API_BASE_URL: "${VITE_API_BASE_URL:-http://localhost:3000/api}"
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - type: bind
        source: ../ai-playground-frontend
        target: /app
      - type: volume
        source: frontend_node_modules
        target: /app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ai-playground-network

  adminer:
    image: adminer:4
    container_name: ai-playground-adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ai-playground-network

networks:
  ai-playground-network:
    name: ai-playground-network
    driver: bridge

volumes:
  postgres_data:
    name: ai-playground-postgres-data
  backend_node_modules:
    name: ai-playground-backend-node-modules
  frontend_node_modules:
    name: ai-playground-frontend-node-modules
